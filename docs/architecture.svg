<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture</title>
  <desc id="desc">Server routes requests to ShopLedger business libraries and data storage. The stock and cancellation flow between orders and inventory is highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="stockArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #172033; }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .label { font-size: 15px; font-weight: 700; }
      .detail { font-size: 12px; fill: #526174; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; rx: 10; }
      .entry { fill: #e0f2fe; stroke: #0284c7; stroke-width: 2; rx: 10; }
      .route { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; rx: 10; }
      .data { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 10; }
      .stock { fill: #fff7ed; stroke: #d97706; stroke-width: 3; rx: 10; }
      .line { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .stockline { fill: none; stroke: #d97706; stroke-width: 3; marker-end: url(#stockArrow); }
      .flowlabel { font-size: 12px; font-weight: 700; fill: #a16207; }
    </style>
  </defs>

  <rect width="1280" height="820" fill="white"/>
  <text x="56" y="58" class="title">ShopLedger architecture</text>
  <text x="56" y="84" class="subtitle">Express request handling, business modules, and JSON persistence</text>

  <rect x="56" y="150" width="180" height="92" class="entry"/>
  <text x="146" y="187" text-anchor="middle" class="label">server.js</text>
  <text x="146" y="210" text-anchor="middle" class="detail">Express app wiring</text>

  <rect x="320" y="150" width="190" height="92" class="route"/>
  <text x="415" y="187" text-anchor="middle" class="label">routes/</text>
  <text x="415" y="210" text-anchor="middle" class="detail">HTTP request handlers</text>
  <path d="M236 196 H320" class="line"/>

  <rect x="615" y="52" width="200" height="82" class="box"/>
  <text x="715" y="84" text-anchor="middle" class="label">lib/invoice.js</text>
  <text x="715" y="106" text-anchor="middle" class="detail">Invoice rendering</text>

  <rect x="615" y="164" width="200" height="92" class="stock"/>
  <text x="715" y="198" text-anchor="middle" class="label">lib/orders.js</text>
  <text x="715" y="221" text-anchor="middle" class="detail">Create and cancel orders</text>

  <rect x="615" y="292" width="200" height="82" class="box"/>
  <text x="715" y="324" text-anchor="middle" class="label">lib/pricing.js</text>
  <text x="715" y="346" text-anchor="middle" class="detail">Totals and discounts</text>

  <rect x="615" y="404" width="200" height="82" class="box"/>
  <text x="715" y="436" text-anchor="middle" class="label">lib/tax.js</text>
  <text x="715" y="458" text-anchor="middle" class="detail">HSN GST slab lookup</text>

  <rect x="930" y="164" width="220" height="92" class="stock"/>
  <text x="1040" y="198" text-anchor="middle" class="label">lib/inventory.js</text>
  <text x="1040" y="221" text-anchor="middle" class="detail">Check, deduct, restock</text>

  <rect x="930" y="314" width="220" height="82" class="box"/>
  <text x="1040" y="346" text-anchor="middle" class="label">lib/ledger.js</text>
  <text x="1040" y="368" text-anchor="middle" class="detail">Khata and settlements</text>

  <rect x="930" y="458" width="220" height="82" class="box"/>
  <text x="1040" y="490" text-anchor="middle" class="label">lib/dates.js</text>
  <text x="1040" y="512" text-anchor="middle" class="detail">Date normalization</text>

  <rect x="930" y="642" width="220" height="92" class="data"/>
  <text x="1040" y="676" text-anchor="middle" class="label">data/db.json</text>
  <text x="1040" y="699" text-anchor="middle" class="detail">Products, orders, customers</text>

  <path d="M510 180 H615" class="line"/>
  <path d="M510 196 H575 V333 H615" class="line"/>
  <path d="M510 212 H575 V355 H900 V355 H930" class="line"/>
  <path d="M510 226 H575 V499 H930" class="line"/>
  <path d="M715 164 V134" class="line"/>
  <path d="M715 256 V292" class="line"/>
  <path d="M715 374 V404" class="line"/>
  <path d="M815 333 H930" class="line"/>
  <path d="M815 440 H870 V688 H930" class="line"/>
  <path d="M1040 256 V314" class="line"/>
  <path d="M1040 396 V642" class="line"/>
  <path d="M1040 540 V642" class="line"/>

  <path d="M815 184 C855 132, 890 132, 930 184" class="stockline"/>
  <path d="M930 236 C890 288, 855 288, 815 236" class="stockline"/>
  <text x="872" y="122" text-anchor="middle" class="flowlabel">place order: check and deduct stock</text>
  <text x="872" y="305" text-anchor="middle" class="flowlabel">cancel order: restore stock</text>

  <rect x="56" y="690" width="665" height="76" fill="#fff7ed" stroke="#f59e0b" stroke-width="1.5" rx="10"/>
  <text x="80" y="720" class="label">Highlighted stock &amp; cancellation flow</text>
  <text x="80" y="746" class="detail">orders.cancel() calls inventory.release(); order placement calls inventory.check() and inventory.reserve().</text>
</svg>
